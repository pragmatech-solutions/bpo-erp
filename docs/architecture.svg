<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="860" fill="#ffffff" />

  <!-- Client -->
  <rect x="640" y="40" width="320" height="60" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" />
  <text x="800" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Browser / Installed PWA</text>

  <!-- Service worker -->
  <rect x="1000" y="40" width="280" height="60" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" />
  <text x="1140" y="65" text-anchor="middle" font-size="13" fill="#1a1a1a">Service worker (Serwist)</text>
  <text x="1140" y="83" text-anchor="middle" font-size="12" fill="#555555">app/sw.ts</text>

  <!-- Next.js App Router container -->
  <rect x="200" y="150" width="1200" height="140" fill="#f5f5f5" stroke="#666666" stroke-width="2" />
  <text x="215" y="172" font-size="14" font-weight="bold" fill="#1a1a1a">Next.js App Router (app/)</text>

  <rect x="230" y="195" width="260" height="70" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" />
  <text x="360" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">app/(auth)/*</text>
  <text x="360" y="242" text-anchor="middle" font-size="12" fill="#555555">login, signup pages</text>

  <rect x="530" y="195" width="320" height="70" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" />
  <text x="690" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">app/(authenticated)/*</text>
  <text x="690" y="238" text-anchor="middle" font-size="12" fill="#555555">dashboard, leads, teams,</text>
  <text x="690" y="253" text-anchor="middle" font-size="12" fill="#555555">users, campaigns pages</text>

  <rect x="890" y="195" width="470" height="70" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" />
  <text x="1125" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">API routes (.../api/route.ts)</text>
  <text x="1125" y="242" text-anchor="middle" font-size="12" fill="#555555">thin wrappers, call domain backend functions</text>

  <!-- Domain modules container -->
  <rect x="200" y="320" width="1200" height="140" fill="#f5f5f5" stroke="#666666" stroke-width="2" />
  <text x="215" y="342" font-size="14" font-weight="bold" fill="#1a1a1a">Domain modules (backend/ + frontend/ per module)</text>

  <rect x="220" y="365" width="140" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="290" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">auth</text>
  <text x="290" y="411" text-anchor="middle" font-size="11" fill="#555555">login / signup</text>

  <rect x="380" y="365" width="150" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="455" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">leads</text>
  <text x="455" y="411" text-anchor="middle" font-size="11" fill="#555555">create / list / get / update</text>

  <rect x="550" y="365" width="160" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="630" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">teams</text>
  <text x="630" y="411" text-anchor="middle" font-size="11" fill="#555555">manage-teams / dashboard</text>

  <rect x="730" y="365" width="130" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="795" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">users</text>
  <text x="795" y="411" text-anchor="middle" font-size="11" fill="#555555">manage-users</text>

  <rect x="880" y="365" width="140" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="950" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">campaigns</text>
  <text x="950" y="411" text-anchor="middle" font-size="11" fill="#555555">campaigns CRUD</text>

  <rect x="1040" y="365" width="170" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="1125" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">dashboard</text>
  <text x="1125" y="411" text-anchor="middle" font-size="11" fill="#555555">lead-analytics / router</text>

  <rect x="1230" y="365" width="130" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="1295" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">agents</text>
  <text x="1295" y="411" text-anchor="middle" font-size="11" fill="#555555">list-agents</text>

  <!-- Common container -->
  <rect x="200" y="490" width="1200" height="140" fill="#f5f5f5" stroke="#666666" stroke-width="2" />
  <text x="215" y="512" font-size="14" font-weight="bold" fill="#1a1a1a">common/ (shared)</text>

  <rect x="230" y="535" width="340" height="70" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2" />
  <text x="400" y="558" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">common/models</text>
  <text x="400" y="576" text-anchor="middle" font-size="11" fill="#555555">Mongoose schemas: users, leads,</text>
  <text x="400" y="591" text-anchor="middle" font-size="11" fill="#555555">teams, campaigns, request-logs</text>

  <rect x="600" y="535" width="380" height="70" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2" />
  <text x="790" y="558" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">common/backend</text>
  <text x="790" y="576" text-anchor="middle" font-size="11" fill="#555555">authorization.function.ts,</text>
  <text x="790" y="591" text-anchor="middle" font-size="11" fill="#555555">get-current-authenticated-user, get-team-agent-ids</text>

  <rect x="1010" y="535" width="330" height="70" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2" />
  <text x="1175" y="558" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">common/components + components/ui</text>
  <text x="1175" y="576" text-anchor="middle" font-size="11" fill="#555555">header, sidebar, lead-card,</text>
  <text x="1175" y="591" text-anchor="middle" font-size="11" fill="#555555">shadcn primitives</text>

  <!-- MongoDB -->
  <g>
    <path d="M700,715 C700,700 940,700 940,715 L940,780 C940,795 700,795 700,780 Z" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" />
    <ellipse cx="820" cy="715" rx="120" ry="15" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" />
    <text x="820" y="748" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">MongoDB</text>
    <text x="820" y="766" text-anchor="middle" font-size="11" fill="#555555">via common/database.ts</text>
  </g>

  <!-- Arrows -->
  <!-- client -> nextjs -->
  <line x1="800" y1="100" x2="800" y2="150" stroke="#555555" stroke-width="2" marker-end="url(#arrow)" />
  <!-- client -> service worker (registers) -->
  <line x1="960" y1="70" x2="1000" y2="70" stroke="#555555" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <text x="978" y="63" text-anchor="middle" font-size="10" fill="#555555">registers</text>
  <!-- client -> auth module (session cookie) -->
  <path d="M640,80 C420,120 290,260 290,365" fill="none" stroke="#555555" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <text x="380" y="180" text-anchor="middle" font-size="10" fill="#555555">session cookie (JWT)</text>

  <!-- nextjs -> modules -->
  <line x1="800" y1="290" x2="800" y2="320" stroke="#555555" stroke-width="2" marker-end="url(#arrow)" />
  <!-- api routes -> leads (representative "calls") -->
  <line x1="1000" y1="265" x2="455" y2="365" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="760" y="310" text-anchor="middle" font-size="10" fill="#555555">calls</text>

  <!-- modules -> common -->
  <line x1="800" y1="460" x2="800" y2="490" stroke="#555555" stroke-width="2" marker-end="url(#arrow)" />

  <!-- common models -> mongo -->
  <line x1="400" y1="605" x2="750" y2="700" stroke="#555555" stroke-width="2" marker-end="url(#arrow)" />
  <text x="560" y="655" text-anchor="middle" font-size="10" fill="#555555">reads/writes</text>
</svg>
